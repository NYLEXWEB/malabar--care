<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="teamGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#teamGrad)" />
  <circle cx="400" cy="240" r="190" fill="url(#teamGlow)" />
  
  <g transform="translate(400, 240) scale(1.6)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Team figures & quality badge -->
    <circle cx="0" cy="-25" r="14" fill="rgba(255,255,255,0.2)"/>
    <path d="M-22 18 C-22 -2 22 -2 22 18" stroke-width="3"/>
    
    <circle cx="-32" cy="-15" r="10" stroke="#99f6e4"/>
    <path d="M-46 22 C-46 6 -18 6 -18 22" stroke="#99f6e4"/>
    
    <circle cx="32" cy="-15" r="10" stroke="#99f6e4"/>
    <path d="M18 22 C18 6 46 6 46 22" stroke="#99f6e4"/>
    
    <!-- Checklist / Guarantee seal -->
    <path d="M-5 45 L5 45" stroke="#5eead4" stroke-width="3"/>
  </g>
  
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="1">DEDICATED SERVICE PROFESSIONALS</text>
  <text x="400" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#ccfbf1">Background Verified • Fully Trained • Quality Assured</text>
</svg>

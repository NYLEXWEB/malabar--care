      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#deepGrad)" />
  <circle cx="400" cy="240" r="180" fill="url(#glow)" />
  
  <!-- Modern Clean Bathroom & Detail Clean Icon Graphic -->
  <g transform="translate(400, 240) scale(1.6)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Sparkles -->
    <path d="M-50 -40 L-45 -25 L-30 -20 L-45 -15 L-50 0 L-55 -15 L-70 -20 L-55 -25 Z" fill="#ffffff" stroke="none" opacity="0.9"/>

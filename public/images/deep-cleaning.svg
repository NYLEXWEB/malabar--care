    <path d="M-10 12 L-2 20 L14 4" stroke="#ffffff" stroke-width="3.5"/>
  </g>
  
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="1">DEEP CLEANING &amp; SANITIZATION</text>
  <text x="400" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#e0f2fe">Hospital-Grade Disinfection • Kitchen &amp; Bathroom Specialists</text>
